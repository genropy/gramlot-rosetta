<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title} · Source · Gramlot Rosetta</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shared/sources.css">
</head>
<body>
  <main class="source-browser">
    <nav class="source-tabs" aria-label="Source sections">{tabs}</nav>
    <nav aria-label="Source files"><ul class="source-files">{files}</ul></nav>
    <section class="source-panel" aria-label="Source code">
      <h1>{label}</h1>
      <p class="source-path">{filename}</p>
      <pre id="source-code" tabindex="0" aria-label="Source text"><code>{source}</code></pre>
      <a href="{raw_url}">Open raw source</a>
    </section>
  </main>
  {editor_script}
</body>
</html>
