<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosetta · {title} · {example_title}</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shared/frame.css">
</head>
<body>
  <main class="rosetta-frame">
    <header class="rosetta-header">
      <strong>Demo Rosetta</strong>
      <nav aria-label="Implementations">
        <a href="/react/{example}/" {react_current}>React</a>
        <a href="/vue/{example}/" {vue_current}>Vue</a>
        <a href="/pages/{example}/" {pages_current}>Pages Python</a>
        <a href="/pages-js/{example}/" {pages-js_current}>Pages JS</a>
      </nav>
      <a href="/sources/{variant}?example={example}" target="_blank" rel="noopener">View source</a>
    </header>
    <div class="rosetta-layout">
      <aside class="panel">
        <h2>Examples</h2>
        <nav aria-label="Examples">
          {example_links}
        </nav>
        <p class="meta">Orders is on standby.</p>
      </aside>
      <div class="example-column">
      <section class="example-panel" aria-label="Current example">
        <iframe title="{example_title} · {title}" src="/examples/{variant}/{example}/"></iframe>
      </section>
      <div id="pages-tools"></div>
      </div>
      <section class="source-frame-panel" aria-label="Current source">
        <iframe title="Source · {title}" src="/sources/{variant}?example={example}"></iframe>
      </section>
    </div>
  </main>
</body>
</html>
