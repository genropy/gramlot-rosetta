<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d3eb1">
  <link rel="manifest" href="/shared/pwa/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/shared/pwa/icon-192.png">
  <title>Rosetta · {title} · {example_title}</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shared/frame.css">
</head>
<body>
  <main class="rosetta-frame">
    <header class="rosetta-header">
      <p class="release-status">Pre-alpha · First usable release planned for late 2026.</p>
      <a class="brand" href="/">Gramlot <span>Rosetta</span></a>
      <button id="install-app" type="button" hidden>Install app</button>
      <span class="meta">One idea. Five implementations.</span>
    </header>
    <div class="master-layout">
      <aside class="lesson-tree" aria-label="Course navigation">{navigation}</aside>
      <div class="splitter tree-splitter" role="separator" tabindex="0" aria-label="Resize navigation" aria-orientation="vertical"></div>
      <div class="master-content">{content}</div>
    </div>
  </main>
  <script type="module" src="/shared/frame.js"></script>
  <script type="module" src="/shared/pwa/install.js"></script>
</body>
</html>
