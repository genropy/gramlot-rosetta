name: Verify, publish and deploy
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: gramlot-rosetta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require a private registry before accessing the framework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility="$(gh api orgs/genropy/packages/container/gramlot-rosetta-runtime --jq .visibility)"
          [[ "$visibility" == private ]] || { echo 'Rosetta registry must exist and be private'; exit 1; }
      - name: Download and verify the released framework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .build
          gh release download v0.1.3 --repo genropy/gramlot --pattern gramlot-0.1.3-py3-none-any.whl --dir .build
          echo '893b9a75a10437f239739b70f635a602dac24864e68b0c1de4deea2cc80dfae2  .build/gramlot-0.1.3-py3-none-any.whl' | sha256sum -c -
      - run: docker build --platform linux/amd64 --build-arg GRAMLOT_WHEEL_SHA256=893b9a75a10437f239739b70f635a602dac24864e68b0c1de4deea2cc80dfae2 -t gramlot-rosetta:verified .
      - run: |
          docker run -d --name site-check --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:18048:8000 gramlot-rosetta:verified
          python deploy/check-container.py http://127.0.0.1:18048
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          ROSETTA_URL=http://127.0.0.1:18048 npm test
      - if: always()
        run: docker logs site-check || true
      - if: vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: vars.PUBLISH_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="ghcr.io/genropy/gramlot-rosetta-runtime:sha-${GITHUB_SHA}"
          docker tag gramlot-rosetta:verified "$tag"
          visibility="$(gh api orgs/genropy/packages/container/gramlot-rosetta-runtime --jq .visibility)"
          [[ "$visibility" == private ]] || exit 1
          docker push "$tag"
          image="$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")"
          [[ "$image" =~ ^ghcr.io/genropy/gramlot-rosetta-runtime@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
  deploy:
    permissions:
      contents: read
      packages: read
    needs: verify
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the verified digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DESTINATION: ${{ vars.DEPLOY_SSH_DESTINATION }}
          IMAGE: ${{ needs.verify.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DESTINATION" =~ ^[a-z_][a-z0-9_-]*@[a-zA-Z0-9.-]+$ ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DESTINATION" "$IMAGE $GITHUB_ACTOR"
      - if: always()
        run: rm -f ~/.ssh/deploy_key
